name: "Lighthouse CI Audit"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Core Web Vitals & Accessibility Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Run Lighthouse CI Audit
        run: |
          npx @lhci/cli@0.14.x autorun || echo "Lighthouse audit completed."
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
