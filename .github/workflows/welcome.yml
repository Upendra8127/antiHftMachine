name: "Contributor Onboarding Welcome"

on:
  issues:
    types: [opened]
  pull_requests:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome First-Time Issue Contributor
        if: github.event.issue && github.event.issue.author_association == 'FIRST_TIME_CONTRIBUTOR'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `👋 Welcome @${context.actor}! Thank you for opening your first issue in **antiHftMachine**. Our maintainers will review your submission shortly. Please ensure your report follows our [Contributing Guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md).`
            });

      - name: Welcome First-Time PR Contributor
        if: github.event.pull_request && github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Welcome @${context.actor}! Thank you for contributing your first Pull Request to **antiHftMachine**. Please verify that all commits are signed off with DCO 1.1 (\`git commit -s\`) and automated tests pass with \`npm test\`.`
            });
